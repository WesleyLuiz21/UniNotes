name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (full history)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.28.0 git /repo --no-banner

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: Backend/package-lock.json }
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: OpenAPI contract is up to date
        run: npm run openapi && git diff --exit-code openapi.json
      - run: npm audit --omit=dev --audit-level=moderate

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: Frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: Frontend/package-lock.json }
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
        working-directory: Backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: Frontend
      - run: npm run test:e2e
        working-directory: Frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: Frontend/playwright-report }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t uninotes-backend Backend
      - run: docker build -t uninotes-frontend Frontend
      - run: docker build -t uninotes-caddy docker/caddy
      - name: Image vulnerability scan (fails on fixable HIGH/CRITICAL)
        run: |
          for i in uninotes-backend uninotes-frontend uninotes-caddy; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image \
              --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $i
          done

  # Production VPS deployment configuration (host Caddy + compose.existing-proxy.yaml).
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts (shellcheck)
        run: docker run --rm -v "$PWD":/mnt:ro -w /mnt koalaman/shellcheck:v0.10.0 -x -S warning -e SC1091 scripts/*.sh
      - name: VPS compose file is isolated and loopback-only
        env:
          UNINOTES_ORIGIN: https://university.example.test
          APP_SECRET_KEY: placeholder-for-rendering-only
        run: |
          docker compose -f compose.existing-proxy.yaml config --format json > /tmp/compose.json
          python3 - <<'PY'
          import json
          c = json.load(open("/tmp/compose.json"))
          assert c["name"] == "uninotes", c["name"]
          assert set(c["services"]) == {"backend", "frontend"}, c["services"].keys()
          assert not any(n.get("external") for n in c.get("networks", {}).values()), "external network"
          for name, s in c["services"].items():
              for p in s.get("ports", []):
                  assert p.get("host_ip") == "127.0.0.1", f"{name} publishes {p}"
          print("ok: project uninotes, backend+frontend only, loopback ports, no external networks")
          PY
      - name: Host Caddy site block validates
        run: docker run --rm -v "$PWD/deploy:/d:ro" caddy:2.11-alpine sh -c 'mkdir -p /var/log/caddy && caddy validate --config /d/Caddyfile.university --adapter caddyfile'
